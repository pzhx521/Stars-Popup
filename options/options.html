<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stars Popup - Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1 class="header-title">Stars Popup Settings</h1>
      <p class="header-desc">Configure your floating widgets and favorite links.</p>
    </header>

    <div class="toolbar">
      <button id="btn-add-widget" class="btn btn-primary">+ Add Widget</button>
      <button id="btn-toggle-all" class="btn">Hide All</button>
      <button id="btn-export" class="btn">Export Config</button>
      <button id="btn-import" class="btn">Import Config</button>
      <input type="file" id="import-file" accept=".json" style="display: none">
    </div>

    <div id="widget-list" class="widget-list"></div>
  </div>

  <script src="../lib/storage.js"></script>
  <script src="options.js"></script>
</body>
</html>
